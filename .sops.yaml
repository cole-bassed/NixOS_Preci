creation_rules:
# Example host stays user-managed because it is documentation/scaffolding, not a live machine.
- path_regex: configuration/api/hosts/Example/secrets\.ya?ml$
  key_groups:
  - age:
    - *user_craole
    - *user_cc

- path_regex: configuration/api/hosts/Preci/secrets\.ya?ml$
  key_groups:
  - age:
    - *host_Preci
    - *user_craole
    - *user_cc

- path_regex: configuration/api/hosts/QBX/secrets\.ya?ml$
  key_groups:
  - age:
    - *host_QBX
    - *user_craole
    - *user_cc

- path_regex: configuration/api/hosts/Victus/secrets\.ya?ml$
  key_groups:
  - age:
    - *host_Victus
    - *user_craole
    - *user_cc

- path_regex: configuration/api/hosts/TheOracle/secrets\.ya?ml$
  key_groups:
  - age:
    - *host_TheOracle
    - *user_craole
    - *user_cc

- path_regex: configuration/api/users/craole/secrets\.ya?ml$
  key_groups:
  - age:
    - *user_craole
    - *user_cc

- path_regex: configuration/api/users/cc/secrets\.ya?ml$
  key_groups:
  - age:
    - *user_craole
    - *user_cc

# qyatt now has normalized API metadata, but still reuses the shared admin recipient.
- path_regex: configuration/api/users/qyatt/secrets\.ya?ml$
  key_groups:
  - age:
    - *user_qyatt
    - *user_craole
    - *user_cc
